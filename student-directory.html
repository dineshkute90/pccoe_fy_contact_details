<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths Admin Portal</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            max-width: 400px;
            margin: 80px auto;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: none;
        }
        .login-header {
            background: #0d6efd;
            color: white;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            padding: 25px;
            text-align: center;
        }
        .login-body {
            padding: 30px;
        }
        .login-input-group {
            position: relative;
            margin-bottom: 20px;
        }
        .login-input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }
        .login-input-group input {
            padding-left: 45px;
            height: 48px;
            border-radius: 8px;
        }
        .login-btn {
            width: 100%;
            height: 48px;
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- LOGIN CONTAINER -->
    <div id="login-container">
        <div class="card login-card">
            <div class="login-header">
                <i class="fas fa-user-shield fa-3x mb-2"></i>
                <h4 class="mb-0">Admin Portal</h4>
            </div>
            <div class="login-body">
                <div id="loginError" class="alert alert-danger d-none" role="alert"></div>
                
                <!-- Wrap in a form to handle submission & Enter key correctly -->
                <form id="loginForm" onsubmit="doLogin(event)">
                    <div class="login-input-group">
                        <i class="fas fa-user"></i>
                        <input type="email" class="form-control" id="username" placeholder="Authorized Email" required>
                    </div>
                    <div class="login-input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" class="form-control" id="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary login-btn" id="loginBtn">
                        <i class="fas fa-sign-in-alt me-1"></i> Sign In
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD (Initially Hidden) -->
    <div id="app-container" class="d-none">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary px-4">
            <a class="navbar-brand font-weight-bold" href="#">Maths Admin Dashboard</a>
            <div class="ms-auto">
                <span id="userEmail" class="text-light me-3"></span>
                <button class="btn btn-outline-light btn-sm" onclick="doLogout()">Logout</button>
            </div>
        </nav>

        <div class="container-fluid mt-4 px-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table id="studentsTable" class="table table-striped table-hover align-middle width-100" style="width:100%">
                            <thead>
                                <tr>
                                    <th>PRN</th>
                                    <th>Name</th>
                                    <th>Class</th>
                                    <th>Division</th>
                                    <th>Batch</th>
                                    <th>Roll No</th>
                                    <th>Email</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <!-- Dynamic Rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <!-- jQuery & DataTables JS -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

    <script>
        // --- 1. FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let dataTableInstance = null;

        // --- 2. AUTH STATE LISTENER ---
        auth.onAuthStateChanged(user => {
            const loginContainer = document.getElementById('login-container');
            const appContainer = document.getElementById('app-container');

            if (user) {
                // User is signed in
                loginContainer.classList.add('d-none');
                appContainer.classList.remove('d-none');
                document.getElementById('userEmail').innerText = user.email;

                // Load Data
                loadStudentData();
            } else {
                // User is signed out
                loginContainer.classList.remove('d-none');
                appContainer.classList.add('d-none');

                // Destroy DataTable on logout to reset state
                if (dataTableInstance) {
                    dataTableInstance.destroy();
                    dataTableInstance = null;
                }
            }
        });

        // --- 3. LOGIN HANDLER ---
        function doLogin(event) {
            if (event) event.preventDefault();

            const email = document.getElementById('username').value.trim();
            const pwd = document.getElementById('password').value;
            const errDiv = document.getElementById('loginError');
            const loginBtn = document.getElementById('loginBtn');

            errDiv.classList.add('d-none');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Signing In...';

            auth.signInWithEmailAndPassword(email, pwd)
                .catch(error => {
                    errDiv.classList.remove('d-none');
                    errDiv.innerText = error.message;
                })
                .finally(() => {
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt me-1"></i> Sign In';
                });
        }

        // --- 4. LOGOUT HANDLER ---
        function doLogout() {
            auth.signOut();
        }

        // --- 5. FETCH & RENDER DATA ---
        function loadStudentData() {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            db.ref('students').once('value')
                .then(snapshot => {
                    if (snapshot.exists()) {
                        snapshot.forEach(childSnapshot => {
                            const student = childSnapshot.val();
                            const tr = document.createElement('tr');

                            // Corrected template literal string below
                            tr.innerHTML = `
                                <td>${student.prn || '-'}</td>
                                <td>${student.name || '-'}</td>
                                <td>${student.class || '-'}</td>
                                <td>${student.division || '-'}</td>
                                <td>${student.batch || '-'}</td>
                                <td>${student.rollNo || '-'}</td>
                                <td><a href="mailto:${student.emailId || ''}">${student.emailId || '-'}</a></td>
                            `;
                            tableBody.appendChild(tr);
                        });
                    }
                    initDataTable();
                })
                .catch(error => {
                    console.error("Error fetching data:", error);
                });
        }

        // --- 6. DATATABLE INITIALIZATION ---
        function initDataTable() {
            if (dataTableInstance) {
                dataTableInstance.destroy();
            }
            dataTableInstance = $('#studentsTable').DataTable({
                responsive: true,
                pageLength: 10,
                lengthMenu: [10, 25, 50, 100],
                order: [[1, 'asc']]
            });
        }
    </script>
</body>
</html>
